name: Kernel Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential flex bison bc \
            libssl-dev libncurses-dev \
            libelf-dev dwarves

      - name: Setup Swap
        run: |
          sudo swapoff -a
          # 尝试 fallocate，失败则用 dd
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
           sudo swapon /swapfile
          free -h
          swapon --show
      - name: Make scripts executable
        run: |
          chmod +x prebuild_download.sh
          chmod +x build_60x.sh
          chmod +x download_setup_kernel_src.sh

      - name: Download Kernel Src
        run: ./download_setup_kernel_src.sh
        
      - name: Download and Setup prebuilts
        run: ./prebuild_download.sh

      - name: Run build
        run: ./build_60x.sh
